name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    uses: yyoossk/android-build-env/.github/workflows/android-build.yml@main
    with:
      artifact-name: memo-app-debug

  # main のビルドが成功したら、スマホから直接ダウンロードできるようリリースに APK を置く
  release:
    needs: apk
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish latest APK
        run: |
          gh run download "${{ github.run_id }}" -n memo-app-debug -D apk
          f=$(find apk -name "*.apk" | head -1)
          cp "$f" memo-app.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest memo-app.apk \
            --target "${{ github.sha }}" \
            --title "メモ帳 最新版" \
            --notes "スマホでこのページを開き、memo-app.apk をタップしてインストールしてください。"

  # ビルドに失敗したときだけ、エラー内容を Actions の注釈に出す
  diagnose:
    needs: apk
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
      - name: Build and report errors
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          grep -E "error:|ERROR|e: |What went wrong|FAILED|Caused by|\.java:[0-9]+|AAPT" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -40 build.log | while IFS= read -r line; do echo "::notice::${line//%/%25}"; done
          exit $code
